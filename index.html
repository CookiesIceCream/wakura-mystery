<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>和倉温泉 謎解きラリー 〜わくたまくんからの挑戦状〜</title>
  
  <!-- Leaflet.js (地図ライブラリ) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <!-- Google Fonts (和風フォント) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700;800&family=Yuji+Boku&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary-gold: #c59b27;
      --secondary-gold: #e5c365;
      --deep-red: #8f1d24;
      --bg-cream: #fbf8ef;
      --washi-border: #6d4b29;
      --text-dark: #2c2523;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Shippori Mincho', serif;
      background: #201a18;
      color: var(--text-dark);
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* 上部ヘッダー (NIKKE風) */
    header {
      background: linear-gradient(180deg, #1f1715 0%, rgba(31, 23, 21, 0.9) 100%);
      border-bottom: 2px solid var(--primary-gold);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    .title-area h1 {
      font-size: 16px;
      color: var(--secondary-gold);
      letter-spacing: 1px;
      text-shadow: 1px 1px 2px #000;
    }

    .title-area span {
      font-size: 10px;
      color: #dfd5c6;
    }

    .status-badge {
      background: rgba(0,0,0,0.6);
      border: 1px solid var(--primary-gold);
      border-radius: 20px;
      padding: 4px 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: #fff;
      font-size: 12px;
    }

    .status-badge b {
      color: var(--secondary-gold);
      font-size: 15px;
    }

    /* 地図コンテナ */
    #map {
      flex: 1;
      width: 100%;
      height: 100%;
      background: #dfd7c5;
    }

    /* 和風地図タイル用の彩度フィルター */
    .leaflet-tile {
      filter: sepia(35%) contrast(95%) brightness(95%);
    }

    /* カスタムピンデザイン */
    .custom-marker {
      background: linear-gradient(135deg, #fff 0%, #f4ebd9 100%);
      border: 2px solid var(--deep-red);
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
      position: relative;
      cursor: pointer;
      animation: pulse 2s infinite ease-in-out;
    }

    .custom-marker.cleared {
      border-color: #2e7d32;
      background: #e8f5e9;
    }

    .custom-marker .icon {
      font-size: 20px;
    }

    .custom-marker .label-tag {
      position: absolute;
      bottom: -20px;
      white-space: nowrap;
      background: rgba(30, 20, 15, 0.85);
      color: #fff;
      font-size: 10px;
      padding: 2px 6px;
      border-radius: 4px;
      border: 1px solid var(--primary-gold);
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }

    /* 下部情報バー */
    footer {
      background: linear-gradient(0deg, #1f1715 0%, rgba(31, 23, 21, 0.95) 100%);
      border-top: 2px solid var(--primary-gold);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 1000;
    }

    .hint-btn, .nav-btn {
      background: linear-gradient(180deg, #b9323b 0%, var(--deep-red) 100%);
      color: #fff;
      border: 1px solid var(--primary-gold);
      padding: 8px 16px;
      border-radius: 4px;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* モーダル枠 (NIKKE風 和風ポップアップ) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(3px);
      z-index: 2000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-container {
      background: var(--bg-cream);
      border: 3px solid var(--primary-gold);
      border-radius: 12px;
      width: 100%;
      max-width: 440px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      position: relative;
      display: flex;
      flex-direction: column;
      animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    .modal-header {
      background: linear-gradient(90deg, #8f1d24, #b9323b);
      color: #fff;
      padding: 12px 16px;
      text-align: center;
      position: relative;
      border-bottom: 2px solid var(--primary-gold);
    }

    .modal-header h2 {
      font-size: 16px;
      letter-spacing: 1px;
    }

    .close-btn {
      position: absolute;
      top: 10px;
      right: 12px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 20px;
      cursor: pointer;
    }

    .tabs {
      display: flex;
      background: #e9e1cd;
      border-bottom: 1px solid #d4c8af;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-family: inherit;
      font-size: 13px;
      cursor: pointer;
      color: #555;
      font-weight: 700;
    }

    .tab-btn.active {
      background: var(--bg-cream);
      color: var(--deep-red);
      border-bottom: 2px solid var(--deep-red);
    }

    .modal-body {
      padding: 18px 16px;
      flex: 1;
      overflow-y: auto;
    }

    /* スポット案内セクション */
    .spot-guide-img {
      width: 100%;
      height: 140px;
      border-radius: 6px;
      object-fit: cover;
      margin-bottom: 12px;
      border: 1px solid #ccc;
      background: #eae2d1;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
    }

    .spot-desc {
      font-size: 13px;
      line-height: 1.6;
      color: #444;
      margin-bottom: 15px;
    }

    .google-nav-link {
      display: block;
      text-align: center;
      background: #2c5e8a;
      color: #fff;
      text-decoration: none;
      padding: 10px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }

    /* 謎解きセクション */
    .riddle-story {
      background: #f1ebd9;
      border-left: 4px solid var(--deep-red);
      padding: 8px 12px;
      font-size: 12px;
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .riddle-item {
      background: #fff;
      border: 1px solid #e3d9c3;
      border-radius: 6px;
      padding: 10px;
      margin-bottom: 8px;
    }

    .riddle-q {
      font-size: 12px;
      font-weight: 700;
      color: var(--deep-red);
      margin-bottom: 4px;
    }

    .riddle-text {
      font-size: 12px;
      color: #333;
    }

    /* 解答入力欄 (NIKKE風) */
    .answer-box-wrap {
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed #d1c5a5;
      text-align: center;
    }

    .answer-label {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 8px;
      display: block;
      color: #333;
    }

    .input-row {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-bottom: 14px;
    }

    .answer-input {
      width: 100%;
      max-width: 280px;
      height: 42px;
      font-size: 18px;
      text-align: center;
      letter-spacing: 4px;
      border: 2px solid var(--primary-gold);
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      max-width: 280px;
      background: linear-gradient(180deg, #f5a623, #d47a08);
      color: #fff;
      border: 2px solid #fff;
      padding: 10px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      font-family: inherit;
    }

    /* 正解・新スポット解放ファンファーレ */
    .celebrate-popup {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0.8);
      background: #fffdf5;
      border: 4px solid var(--primary-gold);
      border-radius: 16px;
      padding: 24px 20px;
      text-align: center;
      z-index: 3000;
      width: 90%;
      max-width: 360px;
      display: none;
      box-shadow: 0 15px 40px rgba(0,0,0,0.7);
    }

    .celebrate-popup.show {
      display: block;
      transform: translate(-50%, -50%) scale(1);
      animation: popIn 0.3s ease-out;
    }

    .celebrate-title {
      color: var(--deep-red);
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <header>
    <div class="title-area">
      <h1>和倉温泉 謎解きミステリー</h1>
      <span>わくたまくんからの挑戦状</span>
    </div>
    <div class="status-badge">
      <span>解放状況:</span>
      <b id="progress-text">1 / 3</b>
    </div>
  </header>

  <!-- 地図コンテナ -->
  <div id="map"></div>

  <!-- フッター -->
  <footer>
    <button class="hint-btn" onclick="openStoryGuide()">📜 あらすじ・手引き</button>
    <button class="nav-btn" onclick="focusCurrentTarget()">📍 次の目的地へ</button>
  </footer>

  <!-- スポット用モーダル -->
  <div class="modal-overlay" id="modal">
    <div class="modal-container">
      <div class="modal-header">
        <h2 id="modal-title">スポット名</h2>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="tabs">
        <button class="tab-btn active" id="tab-btn-riddle" onclick="switchTab('riddle')">謎解きに挑戦</button>
        <button class="tab-btn" id="tab-btn-guide" onclick="switchTab('guide')">スポット案内</button>
      </div>

      <div class="modal-body">
        <!-- 謎解きコンテンツ -->
        <div id="tab-riddle">
          <div class="riddle-story" id="riddle-story-text">ストーリー</div>
          <div id="riddle-list"></div>

          <div class="answer-box-wrap">
            <span class="answer-label">答えを入力してください（ひらがな）</span>
            <div class="input-row">
              <input type="text" id="answer-input" class="answer-input" placeholder="ここに入力">
            </div>
            <button class="submit-btn" onclick="checkAnswer()">判定する</button>
          </div>
        </div>

        <!-- スポット案内コンテンツ -->
        <div id="tab-guide" style="display: none;">
          <div class="spot-guide-img" id="spot-icon-display">🏛️</div>
          <p class="spot-desc" id="spot-desc-text">案内文</p>
          <a href="#" target="_blank" id="google-maps-link" class="google-nav-link">🗺️ Googleマップでルート案内を開く</a>
        </div>
      </div>
    </div>
  </div>

  <!-- 正解・新スポット解放ファンファーレ -->
  <div class="celebrate-popup" id="celebrate-modal">
    <div style="font-size: 40px; margin-bottom: 8px;">🎊</div>
    <h3 class="celebrate-title">正解おめでとう！</h3>
    <p id="celebrate-msg" style="font-size: 14px; line-height: 1.6; margin-bottom: 16px; color: #444;"></p>
    <button class="submit-btn" onclick="closeCelebrate()">次へ進む</button>
  </div>

  <script>
    // --------------------------------------------------
    // スポットと謎解きデータ (PDF準拠)
    // --------------------------------------------------
    const spotsData = [
      {
        id: 1,
        name: "和倉温泉観光会館",
        lat: 37.0864,
        lng: 136.9174,
        icon: "🏢",
        desc: "和倉温泉の中心にある観光拠点。周辺の宿泊施設やお祭り、観光体験情報が揃うスタート地点です。",
        unlocked: true,
        cleared: false,
        story: "観光案内地図の裏に奇妙な暗号が書かれていた。「和倉の街を深く知りたければ、4つの手がかりを集めて文字を拾い、熱気渦巻く『あの場所』を目指せ！」",
        questions: [
          { q: "【第1問】", t: "1200年前に傷ついた鳥が体を癒やしたことから発見された、和倉の名物（4文字・おんせん）" },
          { q: "【第2問】", t: "七尾湾の冬の味覚！ コリコリした食感の海の幸（3文字・なまこ）" },
          { q: "【第3問】", t: "「湯っ足りパーク」にある海の絶景足湯の名前（つまこいぶねのゆ）" },
          { q: "【第4問】", t: "名勝庭園と夕日の光が美しい和倉の名刹のお寺（せいりんじ）" },
          { q: "【第5問】", t: "殻ごと焼いて食べるのも絶品な冬の貝類（2文字・かき）" },
          { q: "【第6問】", t: "能登で「くだらない・バカ」と気抜けした時に使う方言（5文字・はいだるい）" },
          { q: "【第7問】", t: "甲羅とハサミを持つ冬の味覚の王様（2文字・かに）" },
          { q: "【第8問】", t: "金沢駅〜和倉温泉駅を結ぶ特別な観光列車の名前（はなよめのれん）" }
        ],
        hint: "8つの答えの指定文字を縦に並べると…？（8文字）",
        correctAnswers: ["おまつりかいかん", "オマツリカイカン"],
        nextSpotName: "和倉温泉 お祭り会館"
      },
      {
        id: 2,
        name: "和倉温泉 お祭り会館",
        lat: 37.0869,
        lng: 136.9187,
        icon: "🏮",
        desc: "高さ12m・20トンの日本一の山車『でか山（青柏祭）』や石崎奉燈祭の巨大キリコが展示されている体感型ミュージアムです。",
        unlocked: false,
        cleared: false,
        story: "巨大な展示と熱気を体感したあなた！ 出口付近に新たなメッセージが置かれていた。『お祭りにまつわる5つの謎を解いたら、次はあま〜いご褒美が待っているよ！』",
        questions: [
          { q: "【第1問】", t: "周囲72kmの島で向田の火祭が行われる島の名前（4文字・のとじま）" },
          { q: "【第2問】", t: "石崎奉燈祭をはじめ、夜空を照らす巨大な灯籠の呼び名（4文字・ほうとう）" },
          { q: "【第3問】", t: "神社の神様がお移りになる特別な乗り物の名前（3文字・みこし）" },
          { q: "【第4問】", t: "向田の火祭で、松明が海側へ「○○○○」と豊漁（4文字・たおれる）" },
          { q: "【第5問】", t: "9月20日に行われる国の重要無形民俗文化財の枠旗祭り（おくまかぶとまつり）" }
        ],
        hint: "5つの答えの頭文字などを拾うと…（5文字）",
        correctAnswers: ["のとみるく", "ノトミルク"],
        nextSpotName: "能登ミルク"
      },
      {
        id: 3,
        name: "能登ミルク（ごちそうゴール！）",
        lat: 37.0885,
        lng: 136.9155,
        icon: "🍦",
        desc: "能登半島の大自然で育った生乳を使用した絶品ジェラート（500円）やスイーツが楽しめる超人気カフェです！",
        unlocked: false,
        cleared: false,
        story: "すべての謎を解き明かした！ 能登の歴史、祭り、そして豊かな恵みを巡ったあなたへ、冷たくて甘い最高のご褒美が待っています！",
        questions: [],
        hint: "",
        correctAnswers: [],
        nextSpotName: ""
      }
    ];

    // --------------------------------------------------
    // 地図初期化
    // --------------------------------------------------
    const map = L.map('map', { zoomControl: false }).setView([37.0870, 136.9175], 16);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '© OpenStreetMap'
    }).addTo(map);

    let markers = {};
    let currentActiveSpot = null;

    function renderMarkers() {
      // 既存マーカーの削除
      Object.values(markers).forEach(m => map.removeLayer(m));
      markers = {};

      spotsData.forEach(spot => {
        if (!spot.unlocked) return; // 未解放は表示しない

        const markerEl = document.createElement('div');
        markerEl.className = `custom-marker ${spot.cleared ? 'cleared' : ''}`;
        markerEl.innerHTML = `
          <span class="icon">${spot.icon}</span>
          <span class="label-tag">${spot.name}</span>
        `;

        const icon = L.divIcon({
          html: markerEl,
          className: '',
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        const marker = L.marker([spot.lat, spot.lng], { icon: icon }).addTo(map);
        marker.on('click', () => openSpotModal(spot.id));
        markers[spot.id] = marker;
      });

      updateProgress();
    }

    function updateProgress() {
      const clearedCount = spotsData.filter(s => s.cleared).length;
      document.getElementById('progress-text').innerText = `${clearedCount + 1} / 3`;
    }

    // --------------------------------------------------
    // モーダル操作
    // --------------------------------------------------
    function openSpotModal(spotId) {
      currentActiveSpot = spotsData.find(s => s.id === spotId);
      if (!currentActiveSpot) return;

      document.getElementById('modal-title').innerText = currentActiveSpot.name;
      document.getElementById('spot-icon-display').innerText = currentActiveSpot.icon;
      document.getElementById('spot-desc-text').innerText = currentActiveSpot.desc;
      document.getElementById('google-maps-link').href = 
        `https://www.google.com/maps/dir/?api=1&destination=${currentActiveSpot.lat},${currentActiveSpot.lng}`;

      // 謎解きタブの中身生成
      document.getElementById('riddle-story-text').innerText = currentActiveSpot.story;
      const listContainer = document.getElementById('riddle-list');
      listContainer.innerHTML = '';

      if (currentActiveSpot.questions.length > 0 && !currentActiveSpot.cleared) {
        currentActiveSpot.questions.forEach(item => {
          const div = document.createElement('div');
          div.className = 'riddle-item';
          div.innerHTML = `<div class="riddle-q">${item.q}</div><div class="riddle-text">${item.t}</div>`;
          listContainer.appendChild(div);
        });
        document.querySelector('.answer-box-wrap').style.display = 'block';
        document.getElementById('answer-input').value = '';
      } else {
        // すでにクリア済み or ゴールスポット
        listContainer.innerHTML = `<div style="text-align:center; padding: 20px; font-weight:700; color:var(--deep-red);">✨ このスポットの謎はクリア済みです！</div>`;
        document.querySelector('.answer-box-wrap').style.display = 'none';
      }

      switchTab('riddle');
      document.getElementById('modal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function switchTab(type) {
      const tabRiddle = document.getElementById('tab-riddle');
      const tabGuide = document.getElementById('tab-guide');
      const btnRiddle = document.getElementById('tab-btn-riddle');
      const btnGuide = document.getElementById('tab-btn-guide');

      if (type === 'riddle') {
        tabRiddle.style.display = 'block';
        tabGuide.style.display = 'none';
        btnRiddle.classList.add('active');
        btnGuide.classList.remove('active');
      } else {
        tabRiddle.style.display = 'none';
        tabGuide.style.display = 'block';
        btnRiddle.classList.remove('active');
        btnGuide.classList.add('active');
      }
    }

    // --------------------------------------------------
    // 解答判定 & 新スポット解放
    // --------------------------------------------------
    function checkAnswer() {
      if (!currentActiveSpot) return;
      const val = document.getElementById('answer-input').value.trim().toLowerCase();

      if (currentActiveSpot.correctAnswers.includes(val)) {
        currentActiveSpot.cleared = true;
        closeModal();

        // 次のスポット解放
        const nextSpot = spotsData.find(s => s.id === currentActiveSpot.id + 1);
        if (nextSpot) {
          nextSpot.unlocked = true;
          renderMarkers();
          map.flyTo([nextSpot.lat, nextSpot.lng], 16, { animate: true, duration: 1.5 });
          showCelebrate(
            `見事に謎を解明しました！<br><br><b>新たなスポット【${nextSpot.name}】がマップに解放されました！</b><br>ピンをタップして向かいましょう！`
          );
        } else {
          renderMarkers();
          showCelebrate("全問クリア！ おめでとうございます！<br>能登ミルクで美味しいジェラートを味わって、素敵な和倉の旅を締めくくってください！");
        }
      } else {
        alert("残念！ 答えが違うようだ…！\n問題の手がかりをもう一度見直してみよう。");
      }
    }

    function showCelebrate(msg) {
      document.getElementById('celebrate-msg').innerHTML = msg;
      document.getElementById('celebrate-modal').classList.add('show');
    }

    function closeCelebrate() {
      document.getElementById('celebrate-modal').classList.remove('show');
    }

    function openStoryGuide() {
      alert("【遊び方】\n1. マップ上の光るピンをタップ！\n2. 謎を解いて「答え」を入力欄に送信！\n3. 正解すると新しいスポットが解放されます。\n4. 「スポット案内」からGoogleマップナビも利用できます。");
    }

    function focusCurrentTarget() {
      const active = spotsData.slice().reverse().find(s => s.unlocked);
      if (active) {
        map.flyTo([active.lat, active.lng], 16);
      }
    }

    // 初回描画
    renderMarkers();
  </script>
</body>
</html>
